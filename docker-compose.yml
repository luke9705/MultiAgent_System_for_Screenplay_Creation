services:
  audio:
    build:
      context: .
      dockerfile: Dockerfile.audio
    container_name: scriptura-audio
    ports:
      - "7860:7860"
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  video:
    build:
      context: .
      dockerfile: Dockerfile.video
    container_name: scriptura-video
    ports:
      - "7861:7861"
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7861/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: scriptura-app
    ports:
      - "8080:8080"
    environment:
      - AUDIO_SERVER_URL=http://audio:7860
      - VIDEO_SERVER_URL=http://video:7861
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - MAIN_LLM_MODEL_ID=${MAIN_LLM_MODEL_ID:-openai/gpt-oss-20b}
      - VISION_MODEL_ID=${VISION_MODEL_ID:-google/gemma-3-4b-it}
      - TRANSCRIBE_MODEL_ID=${TRANSCRIBE_MODEL_ID:-openai/whisper-small}
      - IMAGE_MODEL_ID=${IMAGE_MODEL_ID:-black-forest-labs/FLUX.2-klein-base-9B}
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
    depends_on:
      audio:
        condition: service_started
      video:
        condition: service_started
    volumes:
      - ./output:/app/output
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface_cache:
